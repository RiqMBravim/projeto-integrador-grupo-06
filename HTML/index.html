<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema Acadêmico - Login</title>
  <script>
    (function () {
      if (localStorage.getItem("tema") === "escuro") {
        document.documentElement.setAttribute("data-theme", "dark");
      }
    })();
  </script>
  <link rel="stylesheet" href="../CSS/style.css">
  <link rel="stylesheet" href="../CSS/tema.css">
</head>
<body>
  <label class="tema-switch" title="Alternar tema claro/escuro">
    <input type="checkbox" id="temaToggle" aria-label="Alternar modo claro e escuro">
    <span class="tema-slider"></span>
  </label>

  <div class="login-container">
    <div class="header-title">
      <h1>GESTÃO ACADÊMICA</h1>
    </div>

    <div class="login-card">
      <h2>Acessar Conta</h2>

      <form id="loginForm">
        <div class="input-group">
          <label for="email">E-mail ou CPF</label>
          <input
            type="text"
            id="email"
            name="identificador"
            placeholder="Digite seu e-mail ou CPF"
            autocomplete="username"
            required
          >
        </div>

        <div class="input-group">
          <label for="senha">Senha</label>
          <input
            type="password"
            id="senha"
            name="senha"
            placeholder="Digite sua senha"
            autocomplete="current-password"
            required
          >
        </div>

        <p id="loginError" class="login-error" role="alert" aria-live="polite"></p>

        <button type="submit" class="btn-primary">Entrar</button>
      </form>

      <div class="login-footer">
        <a href="#" id="openModal">Primeiro acesso ou sem cadastro? Fale com a coordenação</a>
      </div>
    </div>
  </div>

  <div id="supportModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="supportTitle">
    <div class="modal-content">
      <button type="button" class="close-btn" id="closeModal" aria-label="Fechar">&times;</button>
      <h3 id="supportTitle">Solicitar Acesso</h3>
      <p>Preencha com seus dados para solicitar o envio de senha pela coordenação.</p>

      <form action="mailto:coordenacao@faculdade.edu.br" method="post" enctype="text/plain">
        <div class="input-group">
          <label for="nome">Nome Completo</label>
          <input type="text" id="nome" name="Nome" autocomplete="name" required>
        </div>

        <div class="input-group">
          <label for="email_pessoal">Seu E-mail Pessoal</label>
          <input type="email" id="email_pessoal" name="Email Pessoal" placeholder="seuemail@gmail.com" autocomplete="email" required>
        </div>

        <div class="input-group">
          <label for="mensagem">Matrícula ou CPF</label>
          <input type="text" id="mensagem" name="Documento" required>
        </div>

        <button type="submit" class="btn-primary">Enviar para Coordenação</button>
      </form>
    </div>
  </div>

  <script src="../JS/tema.js"></script>
  <script src="../JS/script.js"></script>
</body>
</html>
