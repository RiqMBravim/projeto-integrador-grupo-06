<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grade de Horários</title>
  <script>
    (function () {
      if (localStorage.getItem("tema") === "escuro") {
        document.documentElement.setAttribute("data-theme", "dark");
      }
    })();
  </script>
  <link rel="stylesheet" href="../CSS/horarios.css">
  <link rel="stylesheet" href="../CSS/tema.css">
</head>
<body>
  <label class="tema-switch" title="Alternar tema claro/escuro">
    <input type="checkbox" id="temaToggle" aria-label="Alternar modo claro e escuro">
    <span class="tema-slider"></span>
  </label>

  <header class="topo">
    <h1>Grade de Horários</h1>
    <p id="nomeAluno">Carregando...</p>
    <nav class="acoes">
      <a href="dashboard.html">Voltar ao painel</a>
      <button type="button" id="btnLogout">Sair</button>
    </nav>
  </header>

  <main class="conteudo">
    <p id="mensagemErro" class="erro" hidden></p>
    <div id="gradeHorarios">
      <p>Carregando horários...</p>
    </div>
  </main>

  <script src="../JS/tema.js"></script>
  <script src="../JS/horarios.js"></script>
</body>
</html>
